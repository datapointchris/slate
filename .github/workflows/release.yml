name: Release

# slate's two release streams, each cut by a push to main whose commits touch
# its own paths:
#
# - The CLI, tagged cli/vX.Y.Z, as a `slate` binary per platform on the GitHub
#   release. `slate update` reads releases under the cli/ prefix, so a bare
#   tag would be invisible to it.
# - The API, tagged vX.Y.Z: its image on ghcr, and deploy/ pushed to ghcr as an
#   OCI artifact pinned to that image's digest, both signed keylessly.
#
# svu computes both versions. go-semantic-release can neither write nor read a
# prefixed tag, and python-semantic-release cannot confine a version to some
# paths, so with it every CLI change would release the API too.
on:
  push:
    branches: [main]
  # A hand trigger for the case push cannot reach. GitHub counts a run it
  # created but never turned into jobs as still running, and refuses a second
  # run of the same workflow while it sits there.
  workflow_dispatch:

# Scoped per job rather than here: validate only reads, and it is the job that
# runs the most third-party code.
permissions:
  contents: read

# Two pushes to main inside one run's window would otherwise race: both resolve
# the same next version from the same newest tag. Never cancel-in-progress: a
# canceled release can leave a tag with nothing published under it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  IMAGE: ghcr.io/${{ github.repository }}
  MANIFESTS: ghcr.io/${{ github.repository }}/manifests
  # What a commit must touch to release the API: everything the image is built
  # from, and the manifests. A change elsewhere, the CLI included, releases no
  # API version whatever its conventional type.
  API_PATHS: src Dockerfile .dockerignore pyproject.toml uv.lock alembic.ini deploy

jobs:
  # Called rather than keyed off `workflow_run`, which names a workflow rather
  # than a commit, so a release could be cut from a tree that is not the one
  # that passed.
  validate:
    uses: ./.github/workflows/validate.yml

  # svu prints the current version unchanged when nothing under cli/ is
  # releasable, and that equality gates the two jobs below.
  #
  # svu exits 1 when no tag matches --tag.pattern, so it cannot name the first
  # release. That case is decided here, at cli/v0.1.0, keyed on the absent tag
  # rather than a failed svu: treating any svu failure as a first release would
  # turn a broken run into a published one.
  cli-version:
    name: Resolve the CLI version
    needs: validate
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      previous: ${{ steps.resolve.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: go install github.com/caarlos0/svu/v3@v3.4.1

      # --v0 keeps a breaking change on 0.x a minor bump, so reaching 1.0 is a
      # decision rather than something the next `feat!:` does.
      - name: Resolve the next version
        id: resolve
        run: |
          previous=$(git tag --list 'cli/v*' --sort=-version:refname | head -1)
          echo "previous=${previous}" >>"$GITHUB_OUTPUT"
          if [ -z "$previous" ]; then
            next='cli/v0.1.0'
          else
            next=$(svu next --tag.pattern 'cli/v*' --tag.prefix 'cli/v' --log.directory cli --v0)
            if [ "$next" = "$previous" ]; then
              echo "No releasable commits under cli/ since ${previous}"
              exit 0
            fi
          fi
          echo "Releasing ${next} (previous: ${previous:-none})"
          echo "tag=${next}" >>"$GITHUB_OUTPUT"

  cli-build:
    name: Build the CLI for ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: cli-version
    if: needs.cli-version.outputs.tag != ''
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # The archive is `slate_<version>_<os>_<arch>.tar.gz`. goselfupdate
      # matches the OS and the Go arch as delimited words in an asset's name,
      # so the underscores are what make it findable. `-o slate`, because the
      # module's last path element would name the binary `cli`. CGO off, so the
      # binary runs on a machine without the build host's libc.
      - name: Build and archive
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          TAG: ${{ needs.cli-version.outputs.tag }}
        run: |
          version="${TAG#cli/}"
          mkdir -p ../dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/datapointchris/slate/cli/internal/cli.version=${version}" \
            -o ../dist/slate .
          tar -czf "../dist/slate_${version#v}_${GOOS}_${GOARCH}.tar.gz" -C ../dist slate
          rm ../dist/slate

      # The publish job attaches these to the release in this run, so a day outlives every use.
      - uses: actions/upload-artifact@v7
        with:
          name: slate-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  cli-publish:
    name: Publish the CLI release
    needs: [cli-version, cli-build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: slate-*
          path: dist
          merge-multiple: true

      # `--` rather than `./*`, because sha256sum echoes its argument and the
      # release asset is named `name`, not `./name`.
      - name: Generate checksums
        run: cd dist && sha256sum -- *.tar.gz >checksums.txt

      # Not `generate_release_notes`, which lists merged pull requests, and
      # would list the API's beside the CLI's.
      - name: Build release notes
        env:
          TAG: ${{ needs.cli-version.outputs.tag }}
          PREVIOUS: ${{ needs.cli-version.outputs.previous }}
        run: |
          range="${PREVIOUS:+${PREVIOUS}..}HEAD"
          {
            echo '## Changes'
            echo
            git log --no-merges --pretty='- %s (%h)' "$range" -- cli
            if [ -n "$PREVIOUS" ]; then
              echo
              echo "**Full changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...${TAG}"
            fi
          } >release-notes.md
          cat release-notes.md

      # The run for a newer push resolves from the same previous tag, so it
      # releases these commits too. GitHub also answers 403 to tagging an older
      # commit once a newer push changed a workflow file, because GITHUB_TOKEN
      # holds no workflows permission.
      - name: Leave the release to a newer push
        id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "main is at ${tip}, past ${GITHUB_SHA}; the run for ${tip} releases these commits"
            echo "superseded=true" >>"$GITHUB_OUTPUT"
          fi

      # Creates the tag with the release, at the commit being built. A tag
      # pushed with GITHUB_TOKEN triggers no workflow, so a build fired by the
      # tag would never run. Latest marks the CLI's newest release, since the
      # API is pulled from ghcr rather than downloaded from here. SHA-pinned
      # because it is third-party, the major tag moves, and this job holds
      # contents: write.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: steps.tip.outputs.superseded != 'true'
        with:
          tag_name: ${{ needs.cli-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body_path: release-notes.md
          make_latest: true

  # The API's tag is pushed before anything is published under it, so the
  # version names this commit from the start. A re-run finds the tag on its
  # own commit and finishes that release, and a later push bumps from it.
  api-version:
    name: Resolve and tag the API version
    needs: validate
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      previous: ${{ steps.resolve.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: go install github.com/caarlos0/svu/v3@v3.4.1

      # The first release is v0.1.0, keyed on the absent tag as the CLI's is.
      # A lightweight tag needs no git identity, and svu reads it.
      - name: Resolve the next version
        id: resolve
        run: |
          previous=$(git tag --list 'v*' --no-contains HEAD --sort=-version:refname | head -1)
          echo "previous=${previous}" >>"$GITHUB_OUTPUT"
          next=$(git tag --list 'v*' --points-at HEAD --sort=-version:refname | head -1)
          if [ -n "$next" ]; then
            echo "${next} already tags ${GITHUB_SHA}, so this run finishes its release"
          else
            tip=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$tip" != "$GITHUB_SHA" ]; then
              echo "main is at ${tip}, past ${GITHUB_SHA}; the run for ${tip} releases these commits"
              exit 0
            fi
            if [ -z "$previous" ]; then
              next='v0.1.0'
            else
              read -ra paths <<<"$API_PATHS"
              directories=()
              for path in "${paths[@]}"; do
                directories+=(--log.directory "$path")
              done
              next=$(svu next --tag.pattern 'v*' --tag.prefix v "${directories[@]}" --v0)
              if [ "$next" = "$previous" ]; then
                echo "No releasable commits under ${API_PATHS} since ${previous}"
                exit 0
              fi
            fi
            git tag "$next" "$GITHUB_SHA"
            git push origin "refs/tags/${next}"
          fi
          echo "Releasing ${next} (previous: ${previous:-none})"
          echo "tag=${next}" >>"$GITHUB_OUTPUT"
          echo "version=${next#v}" >>"$GITHUB_OUTPUT"

  api-publish:
    name: Publish the API image and its manifests
    needs: api-version
    if: needs.api-version.outputs.version != ''
    runs-on: ubuntu-26.04
    # A stalled download fails the job here rather than at Actions' six-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # The OIDC token cosign trades for a signing certificate naming this workflow.
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
      manifests: ${{ steps.manifests.outputs.manifests }}
    env:
      VERSION: ${{ needs.api-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # SHA-pinned because they are third-party, the major tag moves, and the
      # login action is handed a token with packages: write.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A version already on ghcr is never rebuilt, so one tag names one image,
      # and :latest moves only to the newest version. Only "not found" builds:
      # any other error fails the step, so a transient one never republishes a
      # version under a new digest.
      - name: Decide what to publish
        id: publish
        run: |
          newest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/v||' | sort -V | tail -n 1)
          if [ "$newest" = "$VERSION" ]; then
            echo "latest=true" >>"$GITHUB_OUTPUT"
          else
            echo "latest=false" >>"$GITHUB_OUTPUT"
          fi
          if answer=$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1 >/dev/null); then
            echo "::notice::$IMAGE:$VERSION is already published"
            echo "build=false" >>"$GITHUB_OUTPUT"
          elif grep -q ': not found$' <<<"$answer"; then
            echo "build=true" >>"$GITHUB_OUTPUT"
          else
            echo "$answer" >&2
            exit 1
          fi

      # The version for a deployment to pin, :sha-<short> for a person to
      # trace, and :latest for `docker run`. A manifest names the digest.
      - name: Resolve the tags
        if: steps.publish.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ steps.publish.outputs.latest == 'true' }}

      # linux/amd64 alone. The provenance and SBOM attestations ride in the
      # image's index, so the digest a manifest pins carries them.
      - name: Build and push
        if: steps.publish.outputs.build == 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A re-run that built nothing reads the published version's digest.
      - name: Name the image by its digest
        id: image
        env:
          BUILT: ${{ steps.build.outputs.digest }}
        run: |
          pinned=$BUILT
          if [ -z "$pinned" ]; then
            pinned=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          fi
          echo "ref=$IMAGE@$pinned" >>"$GITHUB_OUTPUT"
          echo "Image \`$IMAGE@$pinned\`" >>"$GITHUB_STEP_SUMMARY"

      # Each is pinned by version and by the SHA-256 its release publishes for
      # the linux asset. A bump edits both.
      - name: Install flux, kustomize and cosign
        env:
          FLUX_VERSION: 2.9.6
          FLUX_SHA256: b4d22673e9246cbd628881f1a9ef3b090085dced291e42d804555cee8e8d42c5
          KUSTOMIZE_VERSION: 5.8.3
          KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61
          COSIGN_VERSION: 3.1.4
          COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/flux.tar.gz" \
            "https://github.com/fluxcd/flux2/releases/download/v$FLUX_VERSION/flux_${FLUX_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/kustomize.tar.gz" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv$KUSTOMIZE_VERSION/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v$COSIGN_VERSION/cosign-linux-amd64"
          printf '%s  %s\n' \
            "$FLUX_SHA256" "$RUNNER_TEMP/flux.tar.gz" \
            "$KUSTOMIZE_SHA256" "$RUNNER_TEMP/kustomize.tar.gz" \
            "$COSIGN_SHA256" "$RUNNER_TEMP/cosign" |
            sha256sum -c --quiet -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/flux.tar.gz" -C "$RUNNER_TEMP/bin" flux
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP/bin" kustomize
          install -m 0755 "$RUNNER_TEMP/cosign" "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      # A copy of deploy/ with the digest and the version written into both
      # paths, pushed as manifests:<version>. --reproducible makes a re-run
      # send the same bytes for the same digest. The source and revision travel
      # in the artifact, and Flux reports them beside what it applied.
      - name: Push the manifests
        id: manifests
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          work=$(mktemp -d)
          cp -R deploy/. "$work/"
          for path in app migrate; do
            (
              cd "$work/$path"
              kustomize edit set image "slate=$IMAGE_REF"
              kustomize edit add label --without-selector --include-templates "app.kubernetes.io/version:$VERSION"
            )
            kustomize build "$work/$path" >/dev/null
          done
          pushed=$(flux push artifact "oci://$MANIFESTS:$VERSION" --path="$work" \
            --source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --revision="$VERSION@sha1:$GITHUB_SHA" \
            --reproducible --output=json | jq -r .digest)
          echo "manifests=$MANIFESTS@$pushed" >>"$GITHUB_OUTPUT"
          echo "Manifests \`$MANIFESTS:$VERSION\` as \`$MANIFESTS@$pushed\`" >>"$GITHUB_STEP_SUMMARY"

      # Keyless, so the signing certificate names this workflow on this ref and
      # no key exists to keep. A deployment verifies the artifact against that
      # identity before applying it. The verify proves the pair the release
      # notes print is the one a consumer can check. A re-run signs again, and
      # either signature verifies.
      - name: Sign the image and the manifests
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          MANIFESTS_REF: ${{ steps.manifests.outputs.manifests }}
        run: |
          cosign sign --yes "$IMAGE_REF"
          cosign sign --yes "$MANIFESTS_REF"
          cosign verify --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_REF" "$MANIFESTS_REF" >/dev/null

  api-release:
    name: Publish the API release
    needs: [api-version, api-publish]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build release notes
        env:
          TAG: ${{ needs.api-version.outputs.tag }}
          PREVIOUS: ${{ needs.api-version.outputs.previous }}
          IMAGE_REF: ${{ needs.api-publish.outputs.image }}
          MANIFESTS_REF: ${{ needs.api-publish.outputs.manifests }}
        run: |
          range="${PREVIOUS:+${PREVIOUS}..}${TAG}"
          read -ra paths <<<"$API_PATHS"
          {
            echo '## Changes'
            echo
            git log --no-merges --pretty='- %s (%h)' "$range" -- "${paths[@]}"
            echo
            echo '## Published'
            echo
            echo "- Image: \`$IMAGE_REF\`"
            echo "- Manifests: \`$MANIFESTS_REF\`, with \`migrate/\` to apply before \`app/\`"
            echo
            echo 'Both are signed by this workflow on main:'
            echo
            echo '```bash'
            echo "cosign verify --certificate-identity '$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  $MANIFESTS_REF"
            echo '```'
            if [ -n "$PREVIOUS" ]; then
              echo
              echo "**Full changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...${TAG}"
            fi
          } >release-notes.md
          cat release-notes.md

      # The tag already exists, so this creates only the release. It never
      # takes Latest from the CLI's.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.api-version.outputs.tag }}
          body_path: release-notes.md
          make_latest: false
