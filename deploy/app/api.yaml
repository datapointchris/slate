# slate's API: a stateless Deployment behind a Service.
#
# The cluster supplies what this directory does not create:
#
# - A ConfigMap named slate-settings, holding the settings README.md lists as
#   environment variables, all but the Postgres login.
# - A Secret named postgres-app, holding the Postgres login as POSTGRES_HOST,
#   POSTGRES_PORT, POSTGRES_USERNAME, POSTGRES_PASSWORD and POSTGRES_DB. Its
#   role needs SELECT, INSERT, UPDATE and DELETE on every table and USAGE on
#   every sequence, including those a later migration creates, and nothing
#   that changes the schema. The migration Job alone logs in as the owner.
# - A route to the Service reaching /.well-known/oauth-protected-resource as
#   well as /api/v1, since `slate auth login` reads the first to find the
#   issuer. PUBLIC_URL names the address that route serves.
# - Each NetworkPolicy the pod reaches Postgres and the issuer through.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slate-api
  labels:
    app.kubernetes.io/instance: slate-api
    app.kubernetes.io/component: api
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: slate-api
  labels:
    app.kubernetes.io/instance: slate-api
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: slate
    app.kubernetes.io/instance: slate-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slate-api
  labels:
    app.kubernetes.io/instance: slate-api
    app.kubernetes.io/component: api
  annotations:
    kubernetes.io/description: slate's HTTP API, serving /api/v1 to the CLI and to services over Postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slate
      app.kubernetes.io/instance: slate-api
  # The new pod is ready before the old one stops, so a release drops no requests.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: slate-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: slate-api
      automountServiceAccountToken: false
      # Service links would put POSTGRES_PORT=tcp://<ip>:5432 in the environment
      # wherever a Service named postgres shares the namespace, and the API reads
      # POSTGRES_PORT as a number.
      enableServiceLinks: false
      # The image's numeric USER is the uid, so runAsNonRoot can check it.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Covers the preStop sleep plus the Dockerfile's --timeout-graceful-shutdown,
      # with room to spare. Raise it with that flag.
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: slate
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: slate-settings
          # POSTGRES_PORT may be left out of the Secret, and then reads as 5432.
          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: POSTGRES_PORT
                  optional: true
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: POSTGRES_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: POSTGRES_DB
          # Endpoints drop a terminating pod a moment after TERM reaches it, so
          # the sleep keeps it accepting until no proxy routes to it.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # /ready answers 503 until Postgres has answered once, and 200 after, so an
          # outage is answered per request with the API's own 503 rather than taking
          # every pod out of the Service.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          # Sized from the API's working set under steady use, which passes 200 MiB
          # within minutes of a start and climbs with its requests. The limit equals
          # the request, so the pod never uses more memory than the scheduler set
          # aside for it. The CPU request is twice the API's busiest reading, about
          # 100m. A node short of CPU shares it by request, and a starved API
          # misses its one-second liveness probe and is restarted.
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
