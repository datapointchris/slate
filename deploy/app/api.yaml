# slate's API: a stateless Deployment behind a Service on port 8000.
#
# The cluster supplies what this directory does not create:
#
# - A ConfigMap and a Secret, both named slate-settings, holding the settings
#   README.md lists as environment variables. OIDC_ISSUER and the Postgres
#   host and database go in the ConfigMap, POSTGRES_PASSWORD in the Secret.
# - A route to the Service reaching /.well-known/oauth-protected-resource as
#   well as /api/v1, since `slate auth login` reads the first to find the
#   issuer. PUBLIC_URL names the address that route serves.
# - Each NetworkPolicy the pod reaches Postgres and the issuer through.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slate-api
  labels:
    app.kubernetes.io/instance: slate-api
    app.kubernetes.io/component: api
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: slate-api
  labels:
    app.kubernetes.io/instance: slate-api
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: slate
    app.kubernetes.io/instance: slate-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slate-api
  labels:
    app.kubernetes.io/instance: slate-api
    app.kubernetes.io/component: api
  annotations:
    kubernetes.io/description: slate's HTTP API, serving /api/v1 to the CLI and to services over Postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slate
      app.kubernetes.io/instance: slate-api
  # The new pod is ready before the old one stops, so a release drops no requests.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: slate-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: slate-api
      automountServiceAccountToken: false
      # Service links would put POSTGRES_PORT=tcp://<ip>:5432 in the environment
      # wherever a Service named postgres shares the namespace, and the API reads
      # POSTGRES_PORT as a number.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10400
        runAsGroup: 10400
        seccompProfile:
          type: RuntimeDefault
      # The preStop sleep and uvicorn's ten-second drain, with room to spare.
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: slate
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: slate-settings
            - secretRef:
                name: slate-settings
          # Endpoints drop a terminating pod a moment after TERM reaches it, so
          # the sleep keeps it accepting until no proxy routes to it.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # /ready answers 503 while Postgres does not, which takes the pod out of
          # the Service without restarting it.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          # About 100 MiB at rest. The limit equals the request, so the pod never
          # uses more memory than the scheduler set aside for it.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
