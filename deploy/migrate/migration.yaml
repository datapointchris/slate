# `alembic upgrade head` from the API's own image, against the Postgres the
# API uses. It reads ConfigMap slate-settings as app/ does, since the
# migration loads the API's settings. It logs in from Secret postgres, the
# same keys as app/'s postgres-app, as the role that owns the schema, so
# only this Job can change it. Each migration keeps the
# release before it working, so the old pods serve on the new schema while
# the new ones start. For the same reason, a database a later release already
# migrated is left as it is and the Job succeeds, so rolling back to an
# earlier release's manifests rolls its API out.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slate-migrate
  labels:
    app.kubernetes.io/instance: slate-migrate
    app.kubernetes.io/component: migration
automountServiceAccountToken: false
---
# A Job's pod template cannot change once created, so Flux's force annotation
# replaces the Job when a release changes its image, and that runs the next
# migration. It sets no ttlSecondsAfterFinished: Flux would recreate a Job the
# TTL deleted, and run it again. Applied without Flux, delete the finished Job
# before applying a new release.
apiVersion: batch/v1
kind: Job
metadata:
  name: slate-migrate
  labels:
    app.kubernetes.io/instance: slate-migrate
    app.kubernetes.io/component: migration
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
    kubernetes.io/description: Migrates slate's Postgres schema to the release's head before its API rolls out
    ignore-check.kube-linter.io/job-ttl-seconds-after-finished: "Flux recreates a Job its TTL deleted, and would run the migration again"
spec:
  # Retries cover a Postgres that is still starting. alembic exits 1 for that
  # and for a migration that fails, so no exit code is told apart.
  backoffLimit: 4
  activeDeadlineSeconds: 600
  # A drain or a preemption spends no retry.
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: slate-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: slate-migrate
      automountServiceAccountToken: false
      # As in app/: a Service named postgres would otherwise set POSTGRES_PORT.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: slate
          imagePullPolicy: IfNotPresent
          command: [python, -m, slate.database.migrate]
          envFrom:
            - configMapRef:
                name: slate-settings
          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PORT
                  optional: true
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_DB
          # Sized from the migrate service's peak under `docker compose up`, against
          # an empty database. A data migration moving rows can take more, so the
          # limit sits above the request.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
