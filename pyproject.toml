[project]
name = "slate"
# Not a released version. The deployed artifact is the image, named by its tag, and nothing reads this field.
version = "0.0.0"
description = "Work tracker built for coding agents: the API and its Postgres schema."
authors = [{ name = "Chris Birch", email = "chrisbirch@fastmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.13.1",
  "fastapi>=0.111.0",
  # httpx's successor rather than a typosquat of it: same author, developed at pydantic/httpx2 under BSD-3.
  "httpx2>=2.13.0",
  # OTLP over HTTP with protobuf, the spec's default protocol, which needs no grpc.
  "opentelemetry-exporter-otlp-proto-http>=1.45.2",
  "opentelemetry-instrumentation-fastapi>=0.66b2",
  "opentelemetry-instrumentation-psycopg>=0.66b2",
  "opentelemetry-processor-baggage>=0.66b2",
  "opentelemetry-sdk>=1.45.2",
  # [binary] carries its own libpq, so the image installs no system Postgres packages.
  "psycopg[binary]>=3.1.19",
  "pydantic>=2.7.1",
  # [crypto] pulls `cryptography`, which PyJWT needs to verify RS256 access tokens.
  "pyjwt[crypto]>=2.8.0",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.29",
  "structlog>=24.0.0",
  # The zone names the IANA database publishes, which `IanaZone` checks a name against.
  "tzdata>=2025.3",
  "uvicorn[standard]>=0.29.0",
]

[project.urls]
Repository = "https://github.com/datapointchris/slate"

[dependency-groups]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.4.1",
  "pytest-json-report>=1.5.0",
  # The tests read the Postgres image from docker-compose.yml.
  "pyyaml>=6.0.1",
  # FastAPI's TestClient is starlette's, built on httpx2 from 1.2.0.
  "starlette>=1.2.0",
  "testcontainers>=4",
  "ruff==0.17.1",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
verbosity_assertions = 2

[tool.ruff]
line-length = 140
extend-exclude = ["*.md"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true


[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
    "ICN",  # flake8-import-conventions
    # flake8-bandit by rule, never as the family. Most of what the family
    # reports is a subprocess call made on purpose, and silencing that takes an
    # ignore list that grows with every project.
    "S102",  # exec
    "S113",  # an HTTP request with no timeout, which can hang forever
    "S301",  # pickle, which runs code from the bytes it loads
    "S307",  # eval
    "S324",  # md5 or sha1 used for security
    "S501",  # TLS certificate verification turned off
]
ignore = [
    "SIM108",  # ternary operator — often less readable
]

[tool.ruff.lint.isort]
force-single-line = true


[tool.ruff.lint.flake8-import-conventions]
banned-from = ["datetime", "pyspark.sql.functions", "pyspark.sql.types"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
datetime = "dt"
dataclasses = "dc"
sqlalchemy = "sa"
"pyspark.sql.functions" = "sf"
"pyspark.sql.types" = "st"


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]


[tool.mypy]
pretty = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false


[tool.pyright]
typeCheckingMode = "standard"
analyzeUnannotatedFunctions = true


[tool.codespell]
check-filenames = true
check-hidden = true
builtin = "clear,rare"
uri-ignore-words-list = "*"

[tool.forge]
# Keys the shared toolchain standard owns, written by its generator.
# Dropping one from the template removes it here on the next sync; a key absent
# from this list belongs to the project and is never touched. Do not hand-edit.
managed = [
    ["ruff", "line-length"],
    ["ruff", "extend-exclude"],
    ["ruff", "format", "quote-style"],
    ["ruff", "format", "indent-style"],
    ["ruff", "format", "skip-magic-trailing-comma"],
    ["ruff", "format", "line-ending"],
    ["ruff", "format", "docstring-code-format"],
    ["ruff", "lint", "select"],
    ["ruff", "lint", "ignore"],
    ["ruff", "lint", "isort", "force-single-line"],
    ["ruff", "lint", "flake8-import-conventions", "banned-from"],
    ["ruff", "lint", "flake8-import-conventions", "extend-aliases", "datetime"],
    ["ruff", "lint", "flake8-import-conventions", "extend-aliases", "dataclasses"],
    ["ruff", "lint", "flake8-import-conventions", "extend-aliases", "sqlalchemy"],
    ["ruff", "lint", "flake8-import-conventions", "extend-aliases", "pyspark.sql.functions"],
    ["ruff", "lint", "flake8-import-conventions", "extend-aliases", "pyspark.sql.types"],
    ["ruff", "lint", "per-file-ignores", "__init__.py"],
    ["mypy", "pretty"],
    ["mypy", "ignore_missing_imports"],
    ["mypy", "check_untyped_defs"],
    ["mypy", "warn_return_any"],
    ["pyright", "typeCheckingMode"],
    ["pyright", "analyzeUnannotatedFunctions"],
    ["codespell", "check-filenames"],
    ["codespell", "check-hidden"],
    ["codespell", "builtin"],
    ["codespell", "uri-ignore-words-list"],
    ["pytest", "ini_options", "verbosity_assertions"],
    ["pytest", "ini_options", "minversion"],
    ["pytest", "ini_options", "testpaths"],
]
# Dependencies held at the version the pre-commit hook runs, in every group
# and extra that names them, so a local run and CI cannot disagree.
pinned = ["ruff"]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
